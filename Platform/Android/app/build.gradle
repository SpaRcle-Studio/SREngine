plugins {
    id 'com.android.application'
    id 'kotlin-android'
}

// =================================================================================================
// adb devices -l иногда пишет "emulator-5554"
def sdkDir = android.getSdkDirectory().absolutePath
def adbPath = "${sdkDir}/platform-tools/adb"

def adbOutput = ""
try {
    adbOutput = new ByteArrayOutputStream().withStream { os ->
        exec {
            commandLine adbPath, "devices", "-l"
            standardOutput = os
        }
        os.toString()
    }
} catch (Exception e) {
    println "Warning: adb not available, fallback to default archs"
}

def hasPhysical = adbOutput.readLines().any { line ->
    line = line.trim()
    if (line.isEmpty()) return false
    def parts = line.split(/\s+/)
    // Проверяем, что это устройство в состоянии "device" и не эмулятор
    parts.size() > 1 && parts[1] == "device" &&
            !parts[0].startsWith("emulator-") && !parts[0].contains("sdk_gphone")
}

println "Devices: ${adbOutput}"

def archs
if (project.hasProperty("archs")) {
    archs = project.getProperty("archs").split(',')
} else if (hasPhysical) {
    archs = ['armeabi-v7a', 'arm64-v8a']  // все реальные ABI
} else {
    archs = ['x86_64']  // эмулятор
}

println "Selected architectures: ${archs}"
// =================================================================================================

android {
    compileSdk 34

    sourceSets {
        main {
			java.srcDirs = []
            manifest.srcFile 'src/main/AndroidManifest.xml'
        }
		release {
			java.srcDirs = []
		}
    }

    defaultConfig {
        applicationId "com.monika.sparcle"
        minSdk 29
        targetSdk 34
        versionCode 1
        versionName "1.0"
        ndkVersion "29.0.13113456"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        externalNativeBuild {
            cmake {
                cppFlags "-std=c++20 -stdlib=libc++"
            }
        }
        ndk {
            abiFilters(*archs)
        }

        splits {
            abi {
                enable true
                reset()
                include(*archs)
                universalApk true
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            manifestPlaceholders.main_library_name = "sparcle"
        }
        debug {
            jniDebuggable true
            debuggable true
            manifestPlaceholders.main_library_name = "sparcled"
        }
    }

    packagingOptions {
        jniLibs {
            pickFirsts += ['**/libz.so', '**/libvulkan.so', '**/libOpenSLES.so', '**/liblog.so']
            useLegacyPackaging true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }
    externalNativeBuild {
        cmake {
            path file('../../../CMakeLists.txt')
            version "3.30.3"
        }
    }
    buildFeatures {
        viewBinding true
    }
    namespace 'com.monika.sparcle'
    dependenciesInfo {
        includeInApk true
        includeInBundle true
    }
    ndkVersion '29.0.13113456'
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.10.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.navigation:navigation-fragment-ktx:2.7.4'
    implementation 'androidx.navigation:navigation-ui-ktx:2.7.4'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}

