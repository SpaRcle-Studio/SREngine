name: SpaRcle Engine Emscripten CI

on:
  workflow_call:
    secrets:
      CITOKEN:
        required: true

jobs:
  Build:
    name: Emscripten Release.
    runs-on: windows-latest
    steps:
      - name: Fetching repository.
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Updating submodules.
        run: git submodule --quiet update --init --recursive --depth 1 --jobs 4

      - name: Build for Emscripten
        shell: powershell
        working-directory: ${{ github.workspace }}/Platform/Emscripten
        run: |
          .\build.bat
          if ($LASTEXITCODE -ne 0) {
            Write-Error "Emscripten build failed with exit code $LASTEXITCODE"
            exit 1
          }

      - name: Validate Emscripten output files
        shell: powershell
        run: |
          $binDir = Join-Path $env:GITHUB_WORKSPACE "Platform\Emscripten\Bin"
          if (-not (Test-Path $binDir)) {
            Write-Error "Bin directory not found: $binDir"
            exit 1
          }

          $required = @("SREngine.html", "SREngine.js", "SREngine.wasm", "SREngine.data", "SREngine.manifest.json")
          foreach ($f in $required) {
            $p = Join-Path $binDir $f
            if (-not (Test-Path $p)) {
              Write-Error "Required file not found: $p"
              exit 1
            }
            $len = (Get-Item $p).Length
            if ($len -le 0) {
              Write-Error "Required file is empty: $p"
              exit 1
            }
          }

          Write-Host "Emscripten output validated successfully."

      - name: Upload Emscripten test input
        uses: actions/upload-artifact@v4
        with:
          name: Emscripten-test-input
          path: Platform/Emscripten/Bin

  TestsEmscriptenRelease:
    name: Emscripten Release Tests.
    needs: Build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: Emscripten-test-input
          path: Platform/Emscripten/Bin

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Emscripten test dependencies
        working-directory: CI/browser
        run: |
          npm install --ignore-scripts
          npx playwright install --with-deps chromium

      - name: Run Emscripten tests
        timeout-minutes: 10
        working-directory: CI/browser
        env:
          DEBUG: pw:browser
        run: npm test

      - name: Upload Emscripten test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Emscripten-tests
          path: CI/browser/report
          if-no-files-found: ignore

  Publish:
    name: Emscripten Release Publish.
    needs: [Build, TestsEmscriptenRelease]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: Emscripten-test-input
          path: Platform/Emscripten/Bin

      - name: Publish web demo binaries (rewrite history)
        if: ${{ github.event_name == 'push' && (github.ref_name == 'dev' || github.ref_name == 'master') }}
        shell: bash
        env:
          CITOKEN: ${{ secrets.CITOKEN }}
        run: |
          set -euo pipefail

          BIN_DIR="$GITHUB_WORKSPACE/Platform/Emscripten/Bin"

          for f in SREngine.js SREngine.wasm SREngine.data; do
            if [ ! -s "$BIN_DIR/$f" ]; then
              echo "Required file missing or empty: $BIN_DIR/$f"
              exit 1
            fi
          done

          rm -rf webdemo_push
          mkdir -p webdemo_push
          cd webdemo_push

          git init
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git checkout --orphan master

          cp "$BIN_DIR/SREngine.js" .
          cp "$BIN_DIR/SREngine.wasm" .
          cp "$BIN_DIR/SREngine.data" .
          cp "$BIN_DIR/SREngine.html" .
          cp "$BIN_DIR/SREngine.manifest.json" .

          git add SREngine.html SREngine.js SREngine.wasm SREngine.data SREngine.manifest.json
          git commit -m "Update web demo artifacts from SREngine ${GITHUB_SHA}"

          git remote add origin "https://x-access-token:${CITOKEN}@github.com/SpaRcle-Studio/SREngineWebDemo.git"
          git push --force origin master

      - name: Trigger sparcles deploy
        if: ${{ github.event_name == 'push' && (github.ref_name == 'dev' || github.ref_name == 'master') }}
        shell: bash
        env:
          CITOKEN: ${{ secrets.CITOKEN }}
        run: |
          set -euo pipefail
          curl -sSf -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: token ${CITOKEN}" \
            https://api.github.com/repos/SpaRcle-Studio/sparcles/dispatches \
            -d "{\"event_type\":\"webhook\",\"client_payload\":{\"source_repo\":\"SpaRcle-Studio/SREngine\",\"source_sha\":\"${GITHUB_SHA}\",\"demo_repo\":\"SpaRcle-Studio/SREngineWebDemo\"}}"

      - name: Pack Bin to zip
        shell: powershell
        run: |
          $binDir = Join-Path $env:GITHUB_WORKSPACE "Platform\Emscripten\Bin"
          $outDir = Join-Path $env:GITHUB_WORKSPACE "artifacts\emscripten"
          New-Item -ItemType Directory -Force -Path $outDir | Out-Null

          Copy-Item -Path (Join-Path $binDir "*") -Destination $outDir -Recurse -Force

          $zipPath = Join-Path $outDir "SpaRcleEngine_Emscripten_Bin.zip"
          if (Test-Path $zipPath) { Remove-Item $zipPath -Force }
          Compress-Archive -Path (Join-Path $binDir "*") -DestinationPath $zipPath -Force

          Write-Host "Created zip: $zipPath"
          Get-ChildItem -Path $outDir

      - name: Upload Emscripten build (files + zip)
        uses: actions/upload-artifact@v4
        with:
          name: "Emscripten Release SpaRcle Engine"
          path: "${{ github.workspace }}/artifacts/emscripten"
