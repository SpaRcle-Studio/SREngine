name: Formatting

on:
  push:
    paths-ignore:
      - "Documentation/**"
      - "**.md"
    branches:
      - master
      - dev
      - features/*

  workflow_dispatch:

jobs:
  uncrustify:
    name: Uncrustify Formatting
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uncrustify
        run: |
          sudo apt-get update
          sudo apt-get install -y uncrustify

      - name: Run uncrustify
        run: |
          git ls-files -z -- '*.cpp' '*.h' '*.hpp' '*.c' | \
            xargs -0 uncrustify --replace --config .uncrustify.cfg

      - name: Create PR with formatting changes
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.CITOKEN }}
          commit-message: "style: apply uncrustify formatting"
          title: "style: apply uncrustify formatting"
          body: |
            Automated formatting changes applied by uncrustify.

            This PR was generated by the [Formatting workflow](../actions/workflows/Formatting.yml).
          branch: uncrustify-formatting
          delete-branch: true
