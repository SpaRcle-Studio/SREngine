on:
  workflow_call:
    inputs:
      commitMessage:
        required: true
        type: string
    secrets:
      CITOKEN:
        required: true

jobs:
  TestsWindowsReleaseMonolithic:
    name: Windows Release Monolithic Tests.
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Download Release Monolithic build
        uses: actions/download-artifact@v4
        with:
          name: "Windows Release Monolithic SpaRcle Engine"
          path: "${{ runner.temp }}/monolithic-release"

      - name: Run Release Monolithic tests directly from executable
        shell: pwsh
        timeout-minutes: 10
        working-directory: "${{ runner.temp }}/monolithic-release"
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          $executables = @(Get-ChildItem -LiteralPath . -Filter 'SREngine_*.exe' -File)
          if ($executables.Count -ne 1) {
              throw 'Expected exactly one monolithic executable.'
          }
          if (Test-Path -LiteralPath Resources) {
              throw 'Monolithic tests must run without an external Resources folder.'
          }
          & $executables[0].FullName --unit-tests --headless *>&1 | Tee-Object -FilePath monolithic_test_log.txt
          $testExitCode = $LASTEXITCODE
          if ($testExitCode -ne 0) {
              throw "Monolithic tests exited with code $testExitCode."
          }
          $logContent = Get-Content -LiteralPath monolithic_test_log.txt -Raw
          if ($logContent -notmatch 'EngineRuntimeSmokeTest::Run\(\) : launcher initialized successfully\.' -or
              $logContent -notmatch 'TestManager::RunAll\(\) : all tests finished!' -or
              $logContent -notmatch 'Debugger has been stopped with no errors and warnings!') {
              throw 'Monolithic tests did not complete the runtime smoke test successfully.'
          }
          if ((Test-Path -LiteralPath Resources) -or (Test-Path -LiteralPath SREngine)) {
              throw 'Monolithic executable extracted resources or engine files.'
          }

      - name: Upload Release Monolithic test logs
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: "Windows Release Monolithic Test Logs"
          path: |
            ${{ runner.temp }}/monolithic-release/*.txt
            ${{ runner.temp }}/monolithic-release/*.log
          if-no-files-found: ignore

  TestsWindows:
    name: Windows Tests.
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 1) Скачать Debug
      - name: Download Debug build
        uses: actions/download-artifact@v4
        with:
          name: "Windows Debug SpaRcle Engine"
          path: "artifacts/debug"

      # 2) Скачать Release
      - name: Download Release build
        uses: actions/download-artifact@v4
        with:
          name: "Windows Release SpaRcle Engine"
          path: "artifacts/release"

      # 3) Найти exe в debug
      - name: Find debug exe
        id: find_debug
        shell: bash
        run: |
          EXE=$(find artifacts/debug -type f -name "*.exe" | head -n 1)
          if [ -z "$EXE" ]; then
            echo "Debug exe not found"
            exit 1
          fi
          echo "debug_exe=$EXE" >> $GITHUB_OUTPUT

      # 4) Найти exe в release
      - name: Find release exe
        id: find_release
        shell: bash
        run: |
          EXE=$(find artifacts/release -type f -name "*.exe" | head -n 1)
          if [ -z "$EXE" ]; then
            echo "Release exe not found"
            exit 1
          fi
          echo "release_exe=$EXE" >> $GITHUB_OUTPUT

      - name: Run Debug tests
        shell: powershell
        continue-on-error: false
        run: |
          $exe = "${{ steps.find_debug.outputs.debug_exe }}"
          Write-Host "Running: $exe"
          
          # Запускаем приложение, перехватываем вывод
          $logUnpackFile = "debug_unpack_log.txt"
          $logFile = "debug_test_log.txt"
          
          try {
              & $exe --unpack *>&1 | Tee-Object -FilePath $logUnpackFile
          }
          catch {
              Write-Host "Exception during test execution:"
              Write-Host $_
          }
          
          Write-Host "===== Unpack Log ====="
          Get-Content $logUnpackFile
          
          # Папка, где лежит первый exe (packed)
          $exeDir = Split-Path $exe -Parent
          
          # Путь к распакованному бинарнику
          $binDir = Join-Path $exeDir "SREngine/Engine/Bin"
          
          if (-not (Test-Path $binDir)) {
              Write-Host "Folder $binDir not found. It means the packed exe did not unpack anything."
              exit 1
          }

          $unpackedExe = Get-ChildItem -Path $binDir -Filter "SREngine_*.exe" -File | Select-Object -First 1
          if (-not $unpackedExe) {
              Write-Host "Unpacked exe not found in $binDir"
              exit 1
          }

          Write-Host "Found unpacked exe: $($unpackedExe.FullName)"

          # ---- RUN UNPACKED EXE ----
          try {
              & $unpackedExe.FullName --unit-tests --headless *>&1 | Tee-Object -FilePath $logFile
          }
          catch {
              Write-Host "Exception during unpacked exe execution:"
              Write-Host $_
          }

          Write-Host "===== Test Log ====="
          Get-Content $logFile
          
          $logContent = Get-Content $logFile -Raw
  
          if ($logContent -match "Debugger has been stopped with no errors and warnings!") {
            Write-Host "✅ No error message found."
          }
          else {
            Write-Host "❌ Found error message in log!"
            exit 1
          }

      - name: Run Release tests
        shell: powershell
        continue-on-error: false
        run: |
          $exe = "${{ steps.find_release.outputs.release_exe }}"
          Write-Host "Running: $exe"
          
          # Запускаем приложение, перехватываем вывод
          $logUnpackFile = "release_unpack_log.txt"
          $logFile = "release_test_log.txt"
          
          try {
              & $exe --unpack *>&1 | Tee-Object -FilePath $logUnpackFile
          }
          catch {
              Write-Host "Exception during test execution:"
              Write-Host $_
          }
          
          Write-Host "===== Unpack Log ====="
          Get-Content $logUnpackFile
          
          # Папка, где лежит первый exe (packed)
          $exeDir = Split-Path $exe -Parent
          
          # Путь к распакованному бинарнику
          $binDir = Join-Path $exeDir "SREngine/Engine/Bin"
          
          if (-not (Test-Path $binDir)) {
              Write-Host "Folder $binDir not found. It means the packed exe did not unpack anything."
              exit 1
          }

          $unpackedExe = Get-ChildItem -Path $binDir -Filter "SREngine_*.exe" -File | Select-Object -First 1
          if (-not $unpackedExe) {
              Write-Host "Unpacked exe not found in $binDir"
              exit 1
          }

          Write-Host "Found unpacked exe: $($unpackedExe.FullName)"

          # ---- RUN UNPACKED EXE ----
          try {
              & $unpackedExe.FullName --unit-tests --headless *>&1 | Tee-Object -FilePath $logFile
          }
          catch {
              Write-Host "Exception during unpacked exe execution:"
              Write-Host $_
          }

          Write-Host "===== Test Log ====="
          Get-Content $logFile
          
          $logContent = Get-Content $logFile -Raw
          
          if ($logContent -match "Debugger has been stopped with no errors and warnings!") {
            Write-Host "✅ No error message found."
          }
          else {
            Write-Host "❌ Found error message in log!"
            exit 1
          }


