name: SpaRcle Engine Nightly CI

on:
  schedule:
    - cron: "0 0 * * *"

  workflow_dispatch:
    inputs:
      nightly_branch:
        description: "Additional branch to build nightly"
        required: false
        type: string

permissions:
  contents: write
  actions: read

jobs:
  ###################################################
  # BUILD + TEST (master, dev)
  ###################################################
  NightlyBuild:
    name: Nightly Build (${{ matrix.branch }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        branch: [master, dev]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ matrix.branch }}
          fetch-depth: 0

      - uses: ./.github/workflows/WindowsCI.yml
      - uses: ./.github/workflows/WindowsTestsCI.yml
      - uses: ./.github/workflows/LinuxCI.yml
      - uses: ./.github/workflows/AndroidCI.yml
      - uses: ./.github/workflows/FlatpakCI.yml

  ###################################################
  # OPTIONAL EXTRA BRANCH
  ###################################################
  NightlyExtraBranch:
    if: github.event.inputs.nightly_branch != ''
    name: Nightly Build (${{ github.event.inputs.nightly_branch }})
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.nightly_branch }}
          fetch-depth: 0

      - uses: ./.github/workflows/WindowsCI.yml
      - uses: ./.github/workflows/WindowsTestsCI.yml
      - uses: ./.github/workflows/LinuxCI.yml
      - uses: ./.github/workflows/AndroidCI.yml
      - uses: ./.github/workflows/FlatpakCI.yml

  ###################################################
  # NIGHTLY RELEASE (PER BRANCH)
  ###################################################
  NightlyRelease:
    name: Nightly Release (${{ matrix.branch }})
    runs-on: ubuntu-latest
    needs: [NightlyBuild, NightlyExtraBranch]
    if: always()

    strategy:
      fail-fast: false
      matrix:
        branch:
          - master
          - dev
          - ${{ github.event.inputs.nightly_branch }}

    steps:
      - name: Skip empty branch
        if: matrix.branch == ''
        run: exit 0

      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ${{ matrix.branch }}
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: downloads

      ###################################################
      # FIND LAST REAL (NON-NIGHTLY) RELEASE
      ###################################################
      - name: Find last real release
        id: last_release
        run: |
          LAST=$(git tag | grep -Ev '^nightly-' | sort -V | tail -n 1)
          echo "tag=$LAST" >> $GITHUB_OUTPUT

      ###################################################
      # GENERATE CHANGELOG
      ###################################################
      - name: Generate changelog
        run: |
          if [ -z "${{ steps.last_release.outputs.tag }}" ]; then
            git log --pretty=format:"- %h %s" > changelog.txt
          else
            git log ${{ steps.last_release.outputs.tag }}..HEAD \
              --pretty=format:"- %h %s" > changelog.txt
          fi

      ###################################################
      # COLLECT ONLY ENGINE EXECUTABLES
      ###################################################
      - name: Collect engine executables
        id: collect_bins
        run: |
          mkdir -p release

          echo "Collecting executables for branch: ${{ matrix.branch }}"

          find downloads -type f \( \
            -name "*_${{ matrix.branch }}-*_windows.*" -o \
            -name "*_${{ matrix.branch }}-*_linux.*" \
          \) -exec cp {} release/ \;

          if [ -z "$(ls -A release)" ]; then
            echo "❌ No executables found for nightly release"
            exit 1
          fi

          echo "files<<EOF" >> $GITHUB_OUTPUT
          find release -type f >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      ###################################################
      # PUBLISH NIGHTLY
      ###################################################
      - name: Publish nightly release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly-${{ matrix.branch }}
          name: "Nightly build (${{ matrix.branch }})"
          prerelease: true
          body_path: changelog.txt
          files: ${{ steps.collect_bins.outputs.files }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
