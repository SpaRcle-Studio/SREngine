name: SpaRcle Engine Main CI

on:
  workflow_dispatch:
  push:
    paths-ignore:
      - "Documentation/**"
      - "**.md"
    branches:
      - master
      - dev
      - features/*

  pull_request:
    paths-ignore:
      - "Documentation/**"
      - "**.md"
    branches:
      - master
      - dev
      - features/*

jobs:
  Main:
    name: Main.
    runs-on: ubuntu-latest
    steps:
      - name: Main CI.
        run: echo "Main CI is running."

  BuildWindowsJob:
    name: Windows.
    needs: [Main]
    uses: ./.github/workflows/WindowsCI.yml

  TestsWindowsJob:
    name: Windows Tests.
    needs: [BuildWindowsJob]
    if: ${{ always() }}
    uses: ./.github/workflows/WindowsTestsCI.yml
    with:
      commitMessage: ${{github.event.head_commit.message}}
    secrets: inherit

  BuildLinuxJob:
    name: Linux.
    needs: [Main]
    uses: ./.github/workflows/LinuxCI.yml

  TestsLinuxJob:
    name: Linux Tests.
    needs: [BuildLinuxJob]
    if: ${{ always() }}
    uses: ./.github/workflows/LinuxTestsCI.yml
    with:
      commitMessage: ${{github.event.head_commit.message}}
    secrets: inherit

  BuildAndroidJob:
    name: Android.
    needs: [Main]
    uses: ./.github/workflows/AndroidCI.yml

  BuildFlatpakJob:
    name: Flatpak.
    needs: [Main]
    uses: ./.github/workflows/FlatpakCI.yml

  PostBuild:
    name: PostBuild.
    needs: [TestsWindowsJob, TestsLinuxJob, BuildAndroidJob, BuildFlatpakJob]
    if: ${{ always() }}
    uses: ./.github/workflows/PostBuild.yml
    with:
      windowsBuildState: ${{needs.TestsWindowsJob.result}}
      linuxBuildState: ${{needs.TestsLinuxJob.result}}
      androidBuildState: ${{needs.BuildAndroidJob.result}}
      flatpakBuildState: ${{needs.BuildFlatpakJob.result}}
      commitActor: ${{github.actor}}
      commitSha: ${{github.sha}}
      commitBranch: ${{github.ref_name}}
      commitMessage: ${{github.event.head_commit.message}}
    secrets: inherit

  PublishDevRelease:
    name: Publish Dev Release
    #if: ${{ github.ref_name == 'dev' && github.event_name == 'push' && needs.TestsWindowsJob.result == 'success' && needs.TestsLinuxJob.result == 'success' && needs.BuildAndroidJob.result == 'success' }}
    #needs: [PostBuild]
    needs: [Main]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      workflows: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Delete existing dev-nightly release and tag
        run: |
          gh release delete dev-nightly --yes 2>/dev/null || true
          git push origin :refs/tags/dev-nightly 2>/dev/null || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create tag dev-nightly
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -d dev-nightly 2>/dev/null || true
          git tag dev-nightly ${{ github.sha }}
          git push origin dev-nightly

      #- name: Download Windows Release artifact
      #  uses: actions/download-artifact@v4
      #  with:
      #    name: "Windows Release SpaRcle Engine"
      #    path: artifacts/win

      #- name: Download Linux Release artifact
      #  uses: actions/download-artifact@v4
      #  with:
      #    name: "Linux Release gcc NoUnity SpaRcle Engine"
      #    path: artifacts/linux

      #- name: Download Android Release artifacts
      #  uses: actions/download-artifact@v4
      #  with:
      #    name: "Android Release SpaRcle Engine arm64-v8a"
      #    path: artifacts/android/arm64-v8a

      #- name: Download Android x86_64 artifact
      #  uses: actions/download-artifact@v4
      #  with:
      #    name: "Android Release SpaRcle Engine x86_64"
      #    path: artifacts/android/x86_64

      - name: Prepare release files
        run: |
          set -e
          
          mkdir -p release
          echo "test" > release/file.txt
          
          # WIN_EXE=$(find artifacts/win -type f -name "*.exe" | head -n 1)
          # cp "$WIN_EXE" release/SREngine-Windows-Release-packed.exe
          #      
          # LINUX_BIN=$(find artifacts/linux -type f -name "*-packed" | head -n 1)
          # cp "$LINUX_BIN" release/SREngine-Linux-Release-packed
          # chmod +x release/SREngine-Linux-Release-packed
          # 
          # cp artifacts/android/arm64-v8a/*.apk release/SREngine-Android-Release-arm64-v8a.apk
          # cp artifacts/android/x86_64/*.apk release/SREngine-Android-Release-x86_64.apk
          
          ls -la release

      - name: Create or update release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: dev-nightly
          name: "Dev Nightly (${{ github.sha }})"
          body: |
            Auto-built from branch **dev** at ${{ github.sha }}
            Commit: ${{ github.event.head_commit.message }}
          files: release/*
          overwrite: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
