name: SpaRcle Engine Android CI

on:
  workflow_call:

jobs:
  build:
    name: Build (${{ matrix.arch }})
    runs-on: windows-latest
    strategy:
      matrix:
        arch: [arm64-v8a, x86_64]

    steps:
      - name: Fetching repository.
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Installing Vulkan.
        uses: TWoolhouse/setup-vulkan-sdk@v1.1.0
        with:
          version: 1.3.211.0

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Updating submodules.
        run: git submodule --quiet update --init --recursive --depth 1 --jobs 4

      - name: Building Release (${{ matrix.arch }})
        shell: powershell
        working-directory: ${{ github.workspace }}
        run: |
          "buildSuccessful=false" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          cd Platform/Android
          echo "Install android SDK..."
          dir
          ./install_android_sdk.bat

          echo "Run build for architecture: ${{ matrix.arch }}"
          ./build.bat ${{ matrix.arch }}

          if ($LASTEXITCODE -eq 0) {
              "buildSuccessful=true" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          }
          else {
              Write-Error "Build failed with exit code $LASTEXITCODE"
              exit 1
          }
