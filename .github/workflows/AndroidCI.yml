name: SpaRcle Engine Android CI

on:
  workflow_call:
    inputs:
      buildRelease:
        required: true
        type: string
      artifactPush:
        required: true
        type: string

jobs:
  Preparing:
    name: Build.
    runs-on: windows-latest
    steps:
      - name: Fetching repository.
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Installing Vulkan.
        uses: TWoolhouse/setup-vulkan-sdk@v1.1.0
        with:
          version: 1.3.211.0

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Updating submodules.
        run: git submodule --quiet update --init --recursive --depth 1 --jobs 4

      - if: inputs.buildRelease == 'true'
        name: Building Release.
        shell: powershell
        working-directory: ${{github.workspace}}
        run: |
          echo "releaseSuccessful=false" | Out-File -FilePath $env:GITHUB_ENV -Append
          cd Android
          echo "Install android SDK..."
          dir
          ./install_android_sdk.bat
          echo "Run build..."
          $output = ./build.bat
          $lastLine = $output[-1]
          if ($lastLine -notmatch '(?i)BUILD FAILED') {
            echo "releaseSuccessful=true" | Out-File -FilePath $env:GITHUB_ENV -Append
          }
