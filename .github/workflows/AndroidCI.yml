name: SpaRcle Engine Android CI

on:
  workflow_call:

jobs:
  build:
    name: Build (${{ matrix.arch }})
    runs-on: windows-latest
    strategy:
      matrix:
        arch: [arm64-v8a, x86_64]

    steps:
      - name: Fetching repository.
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Installing Vulkan.
        uses: TWoolhouse/setup-vulkan-sdk@v1.1.0
        with:
          version: 1.3.211.0

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Updating submodules.
        run: git submodule --quiet update --init --recursive --depth 1 --jobs 4

      - name: Setup 7-Zip
        uses: milliewalky/setup-7-zip@v2

      - name: Restore Android SDK cache
        id: android-cache
        uses: actions/cache/restore@v4
        with:
          path: Platform/Android/sdk-cache
          key: android-sdk-windows-ndk29-cmake3303-platform34-v1

      - name: Extract Android SDK from cache
        if: steps.android-cache.outputs.cache-hit == 'true'
        shell: powershell
        working-directory: ${{ github.workspace }}/Platform/Android
        run: |
          7z x sdk-cache\android-sdk.7z -o. -y
          $sdkDir = "${{ github.workspace }}/Platform/Android/android-sdk" -replace '\\', '/'
          $cmakeDir = "$sdkDir/cmake/3.30.3"
          "sdk.dir=$sdkDir`ncmake.dir=$cmakeDir" | Out-File -FilePath local.properties -Encoding utf8 -NoNewline
          Add-Content -Path local.properties -Value ""

      - name: Building Release (${{ matrix.arch }})
        shell: powershell
        working-directory: ${{ github.workspace }}
        env:
          CMAKE_BUILD_PARALLEL_LEVEL: 8
        run: |
          echo "buildSuccessful=false" | Out-File -FilePath $env:GITHUB_ENV -Append
          cd Platform/Android
          if ("${{ steps.android-cache.outputs.cache-hit }}" -ne "true") {
            echo "Install android SDK..."
            ./install_android_sdk.bat
          } else {
            echo "Using Android SDK from cache."
          }
          echo "Run build for architecture: ${{ matrix.arch }}"
          ./build.bat ${{ matrix.arch }}

          if ($LASTEXITCODE -eq 0) {
              echo "buildSuccessful=true" | Out-File -FilePath $env:GITHUB_ENV -Append
          }
          else {
              Write-Error "Build failed with exit code $LASTEXITCODE"
              exit 1
          }

      - name: Compress and save Android SDK cache
        if: steps.android-cache.outputs.cache-hit != 'true' && success()
        shell: powershell
        working-directory: ${{ github.workspace }}/Platform/Android
        run: |
          New-Item -ItemType Directory -Force -Path sdk-cache | Out-Null
          7z a -t7z -mx=5 sdk-cache\android-sdk.7z android-sdk -y
          $size = (Get-Item sdk-cache\android-sdk.7z).Length / 1GB
          Write-Host "Android SDK archive size: $([math]::Round($size, 2)) GB"

      - name: Save Android SDK cache
        if: steps.android-cache.outputs.cache-hit != 'true' && success()
        uses: actions/cache/save@v4
        with:
          path: Platform/Android/sdk-cache
          key: android-sdk-windows-ndk29-cmake3303-platform34-v1

      - if: success()
        name: Prepare APK for upload
        shell: powershell
        working-directory: ${{ github.workspace }}/Platform/Android
        run: |
          $releaseDir = "app/build/outputs/apk/release"
          $uploadDir = "apk_upload"
          New-Item -ItemType Directory -Force -Path $uploadDir | Out-Null
          Get-ChildItem -Path $releaseDir -Filter "*.apk" | Where-Object { $_.Name -notlike "*-unsigned*" } | ForEach-Object { Copy-Item $_.FullName -Destination $uploadDir }
          Get-ChildItem $uploadDir

      - if: success()
        name: Upload packed APK
        uses: actions/upload-artifact@v4
        with:
          name: "Android Release SpaRcle Engine ${{ matrix.arch }}"
          path: "${{ github.workspace }}/Platform/Android/apk_upload"
