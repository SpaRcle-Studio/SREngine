on:
  workflow_call:
    inputs:
      commitMessage:
        required: true
        type: string
    secrets:
      CITOKEN:
        required: true

jobs:
  TestsLinuxReleaseMonolithic:
    name: Linux Release Monolithic Tests.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Install runtime dependencies
        run: |
          sudo tee /etc/apt/apt.conf.d/80-ci-retries > /dev/null <<'EOF'
          Acquire::Retries "5";
          Acquire::http::Timeout "30";
          Acquire::https::Timeout "30";
          APT::Update::Error-Mode "any";
          EOF
          sudo apt-get update
          sudo apt-get install -y libtbb-dev

      - name: Download Release Monolithic build
        uses: actions/download-artifact@v4
        with:
          name: "Linux Release gcc NoUnity Monolithic SpaRcle Engine"
          path: "${{ runner.temp }}/monolithic-release"

      - name: Run Release Monolithic tests directly from executable
        shell: bash
        timeout-minutes: 10
        working-directory: "${{ runner.temp }}/monolithic-release"
        run: |
          set -euo pipefail
          mapfile -t binaries < <(find . -maxdepth 1 -type f -name 'SREngine_*-packed')
          if [ "${#binaries[@]}" -ne 1 ]; then
            echo 'Expected exactly one monolithic executable.'
            exit 1
          fi
          if [ -e Resources ] || [ -e SREngine ]; then
            echo 'Monolithic tests must run without external resources or an unpacked engine.'
            exit 1
          fi
          chmod +x "${binaries[0]}"
          "${binaries[0]}" --unit-tests --headless 2>&1 | tee monolithic_test_log.txt
          grep -Fq 'EngineRuntimeSmokeTest::Run() : launcher initialized successfully.' monolithic_test_log.txt
          grep -Fq 'TestManager::RunAll() : all tests finished!' monolithic_test_log.txt
          grep -Fq 'Debugger has been stopped with no errors and warnings!' monolithic_test_log.txt
          for directory in Resources SREngine; do
            if [ -e "$directory" ]; then
              find "$directory" -print | tee -a monolithic_files.txt
              if [ -n "$(find "$directory" \( -type f -o -type l \) -print -quit)" ]; then
                echo "Monolithic executable created files under $directory; see monolithic_files.txt."
                exit 1
              fi
            fi
          done

      - name: Record Release Monolithic output files
        if: ${{ always() }}
        shell: bash
        run: |
          if [ -d "${{ runner.temp }}/monolithic-release" ]; then
            find "${{ runner.temp }}/monolithic-release" -printf '%y %p\n' > "${{ runner.temp }}/monolithic-release/monolithic_files.txt"
            cat "${{ runner.temp }}/monolithic-release/monolithic_files.txt"
          fi

      - name: Upload Release Monolithic test logs
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: "Linux Release Monolithic Test Logs"
          path: |
            ${{ runner.temp }}/monolithic-release/*.txt
            ${{ runner.temp }}/monolithic-release/*.log
          if-no-files-found: ignore

  TestsLinux:
    name: Linux Tests.
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Installing dependencies.
        run: |
          sudo tee /etc/apt/apt.conf.d/80-ci-retries > /dev/null <<'EOF'
          Acquire::Retries "3";
          Acquire::http::Timeout "30";
          Acquire::https::Timeout "30";
          APT::Update::Error-Mode "any";
          EOF
          bash CI/retry.sh sudo apt-get update

          bash CI/retry.sh sudo apt-get install -y software-properties-common libtbb-dev
          sudo add-apt-repository -y --no-update universe

          bash CI/retry.sh sudo apt-get update

          echo "Installing build-essential..."
          bash CI/retry.sh sudo apt-get install -y build-essential

      # 1) Скачать Debug
      - name: Download Debug build
        uses: actions/download-artifact@v4
        with:
          name: "Linux Debug gcc NoUnity SpaRcle Engine"
          path: "artifacts/debug"

      # 2) Скачать Release
      - name: Download Release build
        uses: actions/download-artifact@v4
        with:
          name: "Linux Release gcc NoUnity SpaRcle Engine"
          path: "artifacts/release"

      # 3) Найти packed-бинарник в debug (SREngine_*_linux.*-packed без расширения; артефакт теряет +x)
      - name: Find debug binary
        id: find_debug
        shell: bash
        run: |
          BIN=$(find artifacts/debug -type f -name "*-packed" | head -n 1)
          if [ -z "$BIN" ]; then
            echo "Debug binary not found. Contents of artifacts/debug:"
            find artifacts/debug -type f
            exit 1
          fi
          chmod +x "$BIN"
          echo "debug_bin=$BIN" >> $GITHUB_OUTPUT

      # 4) Найти packed-бинарник в release
      - name: Find release binary
        id: find_release
        shell: bash
        run: |
          BIN=$(find artifacts/release -type f -name "*-packed" | head -n 1)
          if [ -z "$BIN" ]; then
            echo "Release binary not found. Contents of artifacts/release:"
            find artifacts/release -type f
            exit 1
          fi
          chmod +x "$BIN"
          echo "release_bin=$BIN" >> $GITHUB_OUTPUT

      - name: Run Debug tests
        shell: bash
        continue-on-error: false
        run: |
          BIN="${{ steps.find_debug.outputs.debug_bin }}"
          echo "Running: $BIN"

          log_unpack="debug_unpack_log.txt"
          log_test="debug_test_log.txt"

          set +e
          "$BIN" --unpack 2>&1 | tee "$log_unpack"
          set -e

          echo "===== Unpack Log ====="
          cat "$log_unpack"

          exe_dir=$(dirname "$BIN")
          bin_dir="$exe_dir/SREngine/Engine/Bin"

          if [ ! -d "$bin_dir" ]; then
            echo "Folder $bin_dir not found. Packed binary did not unpack."
            exit 1
          fi

          unpacked_bin=$(find "$bin_dir" -maxdepth 1 -type f -name "SREngine_*" ! -name "*.so*" ! -name "*.so" | head -n 1)
          if [ -z "$unpacked_bin" ]; then
            echo "Unpacked binary not found in $bin_dir"
            exit 1
          fi
          chmod +x "$unpacked_bin"

          echo "Found unpacked binary: $unpacked_bin"

          set +e
          "$unpacked_bin" --unit-tests --headless 2>&1 | tee "$log_test"
          set -e

          echo "===== Test Log ====="
          cat "$log_test"
          
          if grep -q "Debugger has been stopped with no errors and warnings!" "$log_test"; then
            echo "✅ No error message found."
          else
            echo "❌ Found error message in log!"
            exit 1
          fi

      - name: Run Release tests
        shell: bash
        continue-on-error: false
        run: |
          BIN="${{ steps.find_release.outputs.release_bin }}"
          echo "Running: $BIN"

          log_unpack="release_unpack_log.txt"
          log_test="release_test_log.txt"

          set +e
          "$BIN" --unpack 2>&1 | tee "$log_unpack"
          set -e

          echo "===== Unpack Log ====="
          cat "$log_unpack"

          exe_dir=$(dirname "$BIN")
          bin_dir="$exe_dir/SREngine/Engine/Bin"

          if [ ! -d "$bin_dir" ]; then
            echo "Folder $bin_dir not found. Packed binary did not unpack."
            exit 1
          fi

          unpacked_bin=$(find "$bin_dir" -maxdepth 1 -type f -name "SREngine_*" ! -name "*.so*" ! -name "*.so" | head -n 1)
          if [ -z "$unpacked_bin" ]; then
            echo "Unpacked binary not found in $bin_dir"
            exit 1
          fi
          chmod +x "$unpacked_bin"

          echo "Found unpacked binary: $unpacked_bin"

          set +e
          "$unpacked_bin" --unit-tests --headless 2>&1 | tee "$log_test"
          set -e

          echo "===== Test Log ====="
          cat "$log_test"
          
          if grep -q "Debugger has been stopped with no errors and warnings!" "$log_test"; then
            echo "✅ No error message found."
          else
            echo "❌ Found error message in log!"
            exit 1
          fi
